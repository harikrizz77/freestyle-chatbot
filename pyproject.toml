[project]
name = "cannibalization-agent"
version = "0.1.0"
description = "Industry-agnostic multi-agent system for estimating product cannibalization via causal inference."
requires-python = ">=3.11,<3.13"
readme = "README.md"

# --- Core deps: light, always installed. Enough for schema + tool contracts + data store. ---
# NOTE ON PINS: these are compatible-release caps. Run `uv lock` (or `poetry lock`)
# immediately after install to freeze EXACT versions into uv.lock -- that lockfile is the
# real pin. Do not hand-edit resolved versions here.
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "numpy>=1.26,<2.1",          # capped: tensorflow-probability (reduced-form group) lags on numpy 2.x
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "duckdb>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<26.0",
    "python-dotenv>=1.0,<2.0",
    "pyarrow>=16.0,<19.0",       # parquet for processed data
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]

# --- Phase 1a: structural discrete-choice engine ---
structural = [
    "pyblp>=1.1,<2.0",           # aggregate BLP / nested / random-coeff logit
    "xlogit>=0.2.7,<1.0",        # individual-level multinomial / mixed logit
    "pylogit>=1.0,<2.0",         # individual-level nested logit
]

# --- Phase 1b: reduced-form cross-checks. HEAVY (pulls tensorflow-probability). ---
# Install in its own resolve if you hit numpy conflicts:  uv pip install '.[reduced-form]'
reduced-form = [
    "pysyncon>=1.4,<2.0",        # synthetic control
    "tfcausalimpact>=0.0.14,<1.0",  # Bayesian structural time series (TF-based)
    "linearmodels>=6.0,<7.0",    # PanelOLS for DiD / fixed effects
    "statsmodels>=0.14,<1.0",
]

# --- Phase 3: agent orchestration ---
agents = [
    "langgraph>=0.2,<1.0",
    "anthropic>=0.34,<1.0",
    "langsmith>=0.1,<1.0",       # optional tracing; safe to keep
]

# --- Phase 4: external signals ---
signals = [
    "fredapi>=0.5,<1.0",         # macro (FRED)
    "wbgapi>=1.0,<2.0",          # World Bank purchasing-power data
]

# --- Phase 5: serving + UI ---
api = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
ui = [
    "streamlit>=1.36,<2.0",
]

# --- Dev tooling ---
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-python-dateutil",
    "types-PyYAML",
    "pandas-stubs",
    "scipy-stubs",
]

# Convenience meta-group for a full local install (may need a two-step resolve; see reduced-form note).
all = [
    "cannibalization-agent[structural,reduced-form,agents,signals,api,ui,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
# strict only where correctness is load-bearing; relax on third-party-heavy modules
files = ["src/schema", "src/causal", "src/data"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyblp.*", "xlogit.*", "pylogit.*", "pysyncon.*", "causalimpact.*", "linearmodels.*", "fredapi.*", "wbgapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
